<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadly Dozen — Coupon Codes</title>
<style>
  :root {
    --red: #a3271f;
    --red-dark: #7f1e18;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --border: #d9d9d9;
    --card: #f6f5f4;
    --page: #e9e7e5;
    --green: #1a7a3a;
    --amber: #a06a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
  }
  .topbar { height: 6px; background: var(--red); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { color: var(--red); letter-spacing: 1px; font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  /* Login gate */
  #loginGate {
    max-width: 420px;
    margin: 80px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
  }
  #loginGate h2 { margin-top: 0; font-size: 18px; color: var(--red); }
  #loginGate input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 15px;
    margin-bottom: 12px;
  }
  #loginGate button {
    width: 100%;
    padding: 12px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 15px;
  }
  #loginGate button:hover { background: var(--red-dark); }
  #loginError { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 16px; }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px;
    margin-bottom: 24px;
  }
  .card h2 { margin: 0 0 16px; font-size: 17px; color: var(--red); }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  label.field-label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  input[type="text"], input[type="number"], input[type="email"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
  }
  input[type="text"]:disabled { background: #f0eeec; color: var(--muted); }

  .category-check-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 0 2px;
  }
  .category-check-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .category-check-row input { width: 16px; height: 16px; accent-color: var(--red); }

  .create-btn {
    margin-top: 18px;
    padding: 12px 24px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .create-btn:hover { background: var(--red-dark); }

  #formMsg { font-size: 13px; margin-top: 10px; min-height: 16px; }
  #formMsg.error { color: var(--red); }
  #formMsg.success { color: var(--green); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    padding: 10px 12px;
    background: #f0eeec;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: top;
  }
  tbody tr:hover { background: #fafafa; }

  .code-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 700;
    background: #f6e3e1;
    color: var(--red);
    font-family: monospace;
    font-size: 13px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge.active { background: #e3f4e8; color: var(--green); }
  .badge.inactive { background: #eee; color: var(--muted); }

  .row-btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    margin-right: 6px;
  }
  .row-btn.danger { color: var(--red); }
  .row-btn.danger:hover { background: #fbe4e2; }
  .row-btn:hover { background: #f2f2f2; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .refresh-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    float: right;
  }
</style>
</head>
<body>

<div class="topbar"></div>
<div class="wrap">

  <div id="loginGate">
    <h2>DEADLY DOZEN — Coupon Codes</h2>
    <p style="font-size:13px; color:var(--muted);">Enter the admin key to manage coupon codes.</p>
    <input type="password" id="adminKeyInput" placeholder="Admin key" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Continue</button>
    <div id="loginError"></div>
  </div>

  <div id="mainView" style="display:none;">
    <h1>Coupon Codes</h1>
    <p class="subtitle">Create discount codes for specific categories, and see who each one was assigned to and how much it's been used.</p>

    <div class="card">
      <h2>Create a new coupon</h2>
      <div class="form-grid">
        <div>
          <label class="field-label" for="cCode">Coupon code *</label>
          <input type="text" id="cCode" placeholder="e.g. FRIENDS20" style="text-transform:uppercase;">
        </div>
        <div>
          <label class="field-label" for="cPercentage">Discount percentage *</label>
          <input type="number" id="cPercentage" min="1" max="100" placeholder="e.g. 20">
        </div>

        <div class="full">
          <label class="field-label">Applies to category *</label>
          <div class="category-check-row">
            <label><input type="checkbox" value="all" onclick="handleAllCheckbox(this)"> All categories</label>
            <label><input type="checkbox" class="cat-specific" value="solo"> Solo</label>
            <label><input type="checkbox" class="cat-specific" value="double"> Double</label>
            <label><input type="checkbox" class="cat-specific" value="relay"> Relay</label>
          </div>
        </div>

        <div>
          <label class="field-label" for="cName">Assigned to — Name</label>
          <input type="text" id="cName" placeholder="Person this code is for">
        </div>
        <div>
          <label class="field-label" for="cPhone">Assigned to — Phone</label>
          <input type="tel" id="cPhone" placeholder="98765 43210">
        </div>
        <div>
          <label class="field-label" for="cEmail">Assigned to — Email</label>
          <input type="email" id="cEmail" placeholder="name@example.com">
        </div>
        <div>
          <label class="field-label" for="cMaxUses">How many uses to assign this person *</label>
          <input type="number" id="cMaxUses" min="1" placeholder="e.g. 1">
        </div>
      </div>

      <button class="create-btn" onclick="createCoupon()">Create coupon</button>
      <div id="formMsg"></div>
    </div>

    <div class="card">
      <h2 style="display:inline-block;">Existing coupons</h2>
      <button class="refresh-btn" onclick="loadCoupons()">↻ Refresh</button>
      <div id="tableWrap"></div>
    </div>
  </div>
</div>

<script>
  const API_BASE = '';
  let adminKey = '';
  let allCoupons = [];

  function login() {
    adminKey = document.getElementById('adminKeyInput').value.trim();
    if (!adminKey) return;
    loadCoupons();
  }

  function handleAllCheckbox(el) {
    if (el.checked) {
      document.querySelectorAll('.cat-specific').forEach(cb => { cb.checked = false; cb.disabled = true; });
    } else {
      document.querySelectorAll('.cat-specific').forEach(cb => { cb.disabled = false; });
    }
  }

  async function loadCoupons() {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const res = await fetch(`${API_BASE}/api/coupons`, { headers: { 'x-admin-key': adminKey } });
      if (res.status === 403) {
        errEl.textContent = 'Incorrect admin key.';
        return;
      }
      if (!res.ok) {
        errEl.textContent = 'Could not load coupons (status ' + res.status + ').';
        return;
      }
      allCoupons = await res.json();
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('mainView').style.display = '';
      renderTable();
    } catch (e) {
      errEl.textContent = 'Could not reach the server.';
    }
  }

  async function createCoupon() {
    const msgEl = document.getElementById('formMsg');
    msgEl.textContent = '';
    msgEl.className = '';

    const categories = Array.from(document.querySelectorAll('.category-check-row input:checked')).map(cb => cb.value);

    const payload = {
      code: document.getElementById('cCode').value.trim(),
      percentage: Number(document.getElementById('cPercentage').value),
      categories,
      assignedName: document.getElementById('cName').value.trim(),
      assignedPhone: document.getElementById('cPhone').value.trim(),
      assignedEmail: document.getElementById('cEmail').value.trim(),
      maxUses: Number(document.getElementById('cMaxUses').value)
    };

    try {
      const res = await fetch(`${API_BASE}/api/coupons`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        msgEl.textContent = data.error || 'Could not create coupon.';
        msgEl.className = 'error';
        return;
      }
      msgEl.textContent = `Coupon "${data.coupon.code}" created.`;
      msgEl.className = 'success';

      // Reset the form
      document.getElementById('cCode').value = '';
      document.getElementById('cPercentage').value = '';
      document.getElementById('cName').value = '';
      document.getElementById('cPhone').value = '';
      document.getElementById('cEmail').value = '';
      document.getElementById('cMaxUses').value = '';
      document.querySelectorAll('.category-check-row input').forEach(cb => { cb.checked = false; cb.disabled = false; });

      loadCoupons();
    } catch (e) {
      msgEl.textContent = 'Could not reach the server.';
      msgEl.className = 'error';
    }
  }

  async function toggleActive(id, makeActive) {
    try {
      const res = await fetch(`${API_BASE}/api/coupons/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
        body: JSON.stringify({ active: makeActive })
      });
      if (!res.ok) {
        alert('Could not update this coupon.');
        return;
      }
      loadCoupons();
    } catch (e) {
      alert('Could not reach the server.');
    }
  }

  async function deleteCoupon(id, code) {
    if (!confirm(`Delete coupon "${code}" permanently? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${API_BASE}/api/coupons/${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: { 'x-admin-key': adminKey }
      });
      if (!res.ok) {
        alert('Could not delete this coupon.');
        return;
      }
      loadCoupons();
    } catch (e) {
      alert('Could not reach the server.');
    }
  }

  function renderTable() {
    const wrap = document.getElementById('tableWrap');
    if (!allCoupons.length) {
      wrap.innerHTML = '<div class="empty-state">No coupons created yet.</div>';
      return;
    }

    const rows = allCoupons.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    let html = `<table><thead><tr>
      <th>Code</th><th>%</th><th>Categories</th><th>Assigned To</th><th>Uses</th><th>Status</th><th>Created</th><th></th>
    </tr></thead><tbody>`;

    rows.forEach(c => {
      const cats = c.categories.includes('all') ? 'All' : c.categories.map(x => x[0].toUpperCase() + x.slice(1)).join(', ');
      const assigned = [c.assignedName, c.assignedPhone, c.assignedEmail].filter(Boolean).join(' · ') || '—';
      const when = c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-IN') : '—';

      html += `<tr>
        <td><span class="code-pill">${c.code}</span></td>
        <td>${c.percentage}%</td>
        <td>${cats}</td>
        <td>${assigned}</td>
        <td>${c.usedCount} / ${c.maxUses}</td>
        <td><span class="badge ${c.active ? 'active' : 'inactive'}">${c.active ? 'Active' : 'Inactive'}</span></td>
        <td>${when}</td>
        <td>
          <button class="row-btn" onclick="toggleActive('${c.id}', ${!c.active})">${c.active ? 'Disable' : 'Enable'}</button>
          <button class="row-btn danger" onclick="deleteCoupon('${c.id}', '${c.code}')">Delete</button>
        </td>
      </tr>`;
    });

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }
</script>

</body>
</html>
